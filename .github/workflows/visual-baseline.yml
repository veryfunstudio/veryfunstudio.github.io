name: Visual baseline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update:
        description: Re-capture baselines and commit them to this branch
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned capture browser
        run: pnpm exec playwright install --with-deps chromium

      # compare-visual-baseline.mjs shells out to ImageMagick's `compare`;
      # ubuntu-latest does not ship it, so without this the compare step
      # always exits 1 with "ImageMagick not found".
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build
        run: pnpm build

      - name: Capture screenshots
        run: pnpm baseline
        env:
          VFS_BASELINE_OUT: ${{ runner.temp }}/captures

      - name: Upload captured screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline-captures
          path: ${{ runner.temp }}/captures

      - name: Compare against committed baselines
        if: github.event_name != 'workflow_dispatch' || !inputs.update
        run: node scripts/compare-visual-baseline.mjs
        env:
          VFS_CAPTURE_DIR: ${{ runner.temp }}/captures
          VFS_DIFF_DIR: ${{ runner.temp }}/diffs

      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline-diffs
          path: ${{ runner.temp }}/diffs

      - name: Commit refreshed baselines
        if: github.event_name == 'workflow_dispatch' && inputs.update
        run: |
          cp "${{ runner.temp }}/captures"/*.png visual-baseline/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-baseline/
          git diff --cached --quiet || git commit -m "chore(baseline): 重抓视觉基线（CI Linux 环境）"
          git push
