name: Visual baseline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update:
        description: Re-capture baselines and commit them to this branch
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Capture screenshots
        run: pnpm baseline
        env:
          VFS_BASELINE_OUT: ${{ runner.temp }}/captures

      - name: Compare against committed baselines
        if: github.event_name != 'workflow_dispatch' || !inputs.update
        run: node scripts/compare-visual-baseline.mjs
        env:
          VFS_CAPTURE_DIR: ${{ runner.temp }}/captures
          VFS_DIFF_DIR: ${{ runner.temp }}/diffs

      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: ${{ runner.temp }}/diffs

      - name: Commit refreshed baselines
        if: github.event_name == 'workflow_dispatch' && inputs.update
        run: |
          cp "${{ runner.temp }}/captures"/*.png visual-baseline/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-baseline/
          git diff --cached --quiet || git commit -m "chore(baseline): 重抓视觉基线（CI Linux 环境）"
          git push
